spring:
  application:
    name: festi-backend
  servlet:
    multipart:
      max-file-size: ${FESTI_IMAGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${FESTI_IMAGE_MAX_REQUEST_SIZE:6MB}
  config:
    import: optional:classpath:push-messages.yml
  datasource:
    url: ${FESTI_DATABASE_URL:jdbc:postgresql://localhost:5432/festi}
    username: ${FESTI_DATABASE_USERNAME:festi}
    password: ${FESTI_DATABASE_PASSWORD:festi}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

festi:
  images:
    storage-root: ${FESTI_IMAGE_STORAGE_ROOT:./uploads/images}
    public-path: /media/images
  jwt:
    secret: ${FESTI_JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes}
    access-token-expiration: ${FESTI_JWT_ACCESS_TOKEN_EXPIRATION:3600}
  cors:
    allowed-origins: ${FESTI_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  push:
    delivery:
      enabled: ${FESTI_WEB_PUSH_ENABLED:false}
      public-key: ${FESTI_VAPID_PUBLIC_KEY:}
      private-key: ${FESTI_VAPID_PRIVATE_KEY:}
      subject: ${FESTI_VAPID_SUBJECT:}
      ttl-seconds: ${FESTI_WEB_PUSH_TTL_SECONDS:300}
      worker:
        enabled: ${FESTI_WEB_PUSH_WORKER_ENABLED:true}
        poll-delay-millis: ${FESTI_WEB_PUSH_POLL_DELAY_MILLIS:1000}
        batch-size: ${FESTI_WEB_PUSH_BATCH_SIZE:20}
        max-attempts: ${FESTI_WEB_PUSH_MAX_ATTEMPTS:2}
        retry-delay-seconds: ${FESTI_WEB_PUSH_RETRY_DELAY_SECONDS:30}
        processing-timeout-seconds: ${FESTI_WEB_PUSH_PROCESSING_TIMEOUT_SECONDS:300}
