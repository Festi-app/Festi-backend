name: "Festi Backend CI Workflow"

on:
  pull_request:
  push:
    branches: [main]
jobs:
  fast-tests:
    runs-on: ubuntu-latest
    env:
      FESTI_JWT_SECRET: festi-test-action-secret-not-used-in-deployment

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run fast tests
        run: ./gradlew test

  postgres-migration-tests:
    needs: fast-tests
    runs-on: ubuntu-latest
    env:
      FESTI_JWT_SECRET: festi-test-action-secret-not-used-in-deployment
      FESTI_DATABASE_URL: jdbc:postgresql://localhost:5432/festi_test
      FESTI_DATABASE_USERNAME: festi
      FESTI_DATABASE_PASSWORD: festi

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: festi_test
          POSTGRES_USER: festi
          POSTGRES_PASSWORD: festi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festi -d festi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run PostgreSQL migration tests
        run: ./gradlew postgresTest
  
  publish-docker-image:
    needs: postgres-migration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: festi-app/festi-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - name: Build and push API image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
